name: Deploy demo

# Собирает автономную сборку (docs/) и публикует её на GitHub Pages,
# если сайт настроен как «GitHub Actions». Если Pages отдаётся из ветки
# (Settings → Pages → Deploy from a branch → main /), деплой пропускается:
# GitHub сам публикует docs/ при коммите в main, и второй деплой только мешает.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build standalone bundle
        run: npm run build:static

      - name: Check links and assets
        run: npm run check:links

      - name: Detect Pages source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' 2>/dev/null || echo none)
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
          echo "Pages build type: $build_type"

      - name: Pages uses a branch — nothing to deploy
        if: steps.source.outputs.build_type != 'workflow'
        run: |
          echo "### Демо собирается без деплоя" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Pages отдаёт сайт из ветки (\`main\` → \`docs/\`), поэтому публикация" >> "$GITHUB_STEP_SUMMARY"
          echo "идёт автоматически при коммите — отдельный деплой не нужен." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Хотите деплой из Actions: **Settings → Pages → Source: GitHub Actions**." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Pages настроен на ветку — деплой из Actions пропущен, сборка при этом проверена."

      - name: Configure Pages
        if: steps.source.outputs.build_type == 'workflow'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.source.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.source.outputs.build_type == 'workflow'
        uses: actions/deploy-pages@v4
